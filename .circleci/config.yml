version: 2.1

jobs:
  test-with-machine:
    machine:
      image: ubuntu-2204:current  # Fully provisioned Linux VM with Docker preinstalled
    working_directory: ~/project

    steps:
      - checkout  # Clones your repo

      - run:
          name: Install Java and Maven
          command: |
            sudo apt update
            sudo apt install -y maven openjdk-17-jdk
            java -version
            mvn -version

      - run:
          name: Run Tests with Testcontainers
          command: mvn clean verify

workflows:
  version: 2
  test-flow:
    jobs:
      - test-with-machine
