version: 2.1

jobs:
  integration-test-with-machine:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Install Java and Maven
          command: |
            sudo apt update
            sudo apt install -y maven openjdk-17-jdk
            java -version
            mvn -version

      - run:
          name: Run Integration Tests with Testcontainers
          command: mvn clean verify

      - run:
          name: Collect Test Results (JUnit XML only)
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*\.xml" -exec cp {} ~/test-results/junit/ \;
            find . -type f -regex ".*/target/failsafe-reports/TEST-.*\.xml" -exec cp {} ~/test-results/junit/ \;
          when: always

      - store_test_results:
          path: ~/test-results

      - store_artifacts:
          path: ~/test-results
          destination: junit-xml-reports

      - run:
          name: Save Full HTML Test Reports
          command: |
            mkdir -p ~/html-reports/
            cp -r target/site/* ~/html-reports/
          when: always

      - store_artifacts:
          path: ~/html-reports
          destination: html-test-reports

workflows:
  version: 2
  integration-test-workflow:
    jobs:
      - integration-test-with-machine
